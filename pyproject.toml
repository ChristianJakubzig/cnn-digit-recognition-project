[project]
name = "cnn-digit-recognition-project"
version = "0.1.0"
description = "Implementierung mit PyTorch am Beispiel MNIST"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gradio>=6.5.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "torchinfo>=1.8.0",
    "torchview>=0.2.7",
    "torchvision>=0.24.1",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "nbqa>=1.9.1",
]
